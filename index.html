<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ongaku — wireframe</title>
  <meta name="description" content="Ongaku — an offline music player. Wireframe build; specs to follow.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f5f4f'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens/home.css">
  <link rel="stylesheet" href="css/screens/library.css">
  <link rel="stylesheet" href="css/screens/player.css">
  <link rel="stylesheet" href="css/screens/settings.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      <div class="app-header__names">
        <h1 class="app-header__title">Ongaku</h1>
        <p class="app-header__subtitle">wireframe</p>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Primary">
      <a class="nav__link is-active" href="#/home" data-route="home" aria-current="page">Home</a>
      <a class="nav__link" href="#/library" data-route="library">Library</a>
      <a class="nav__link" href="#/player" data-route="player">Player</a>
      <a class="nav__link" href="#/settings" data-route="settings">Settings</a>
    </nav>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <div id="screen" class="screen"></div>
  </main>

  <footer class="player-bar" aria-label="Now playing">
    <div class="player-bar__now">
      <div class="player-bar__art wf-art" aria-hidden="true"></div>
      <div class="player-bar__meta">
        <p class="player-bar__title">No track selected</p>
        <p class="player-bar__artist">Wireframe player</p>
      </div>
    </div>

    <div class="player-bar__center">
      <div class="transport">
        <button class="icon-btn" type="button" aria-label="Previous track" data-player="prev">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="icon-btn icon-btn--primary" type="button" aria-label="Play" aria-pressed="false" data-player="toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Next track" data-player="next">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18 5h-2v14h2zM4 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="progress">
        <span class="progress__time">0:00</span>
        <input class="range" type="range" min="0" max="100" value="0" step="1" aria-label="Seek" data-player="seek">
        <span class="progress__time">0:00</span>
      </div>
    </div>

    <div class="player-bar__volume">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
      <input class="range" type="range" min="0" max="100" value="70" step="1" aria-label="Volume" data-player="volume">
    </div>
  </footer>

  <script src="js/router.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/library.js"></script>
  <script src="js/screens/player.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
